name: mobileremunerationapplication
description: Sistem Remunerasi Restoran — Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.4.0

  # State Management
  provider: ^6.1.2

  # Local Storage (simpan token & user data)
  shared_preferences: ^2.2.3

  # PDF Viewer
  flutter_pdfview: ^1.3.2

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/